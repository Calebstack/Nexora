name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check Go formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build binaries
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker

      - name: Run tests
        run: go test ./... -race -count=1 -timeout 90s

      - name: Validate migration versions and clean database
        run: go test ./internal/postgres -run 'TestMigrationFilesHaveUniqueVersions|TestMigrations' -count=1 -timeout 90s

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Validate the OpenAPI document
        run: |
          go run ./tools/openapicheck \
            -spec docs/openapi.yaml \
            -manifest docs/api-routes.yaml

      - name: Check the route manifest is current
        run: |
          go run ./tools/openapicheck -spec docs/openapi.yaml -write-manifest
          git diff --exit-code -- docs/api-routes.yaml

      - name: Test the validator
        run: go test ./tools/openapicheck/... -count=1

  security:
    name: Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          $(go env GOPATH)/bin/gosec ./...

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: go
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-worker:${{ github.sha }}

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  sdk-models:
    name: Generated SDK models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: python -m pip install -r tools/sdkgen-requirements.txt

      - name: Check generated model files
        run: python tools/sdkgen.py --check

  sdk-go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: sdk-go/go.mod

      - name: Test
        run: go test ./... -race -count=1

      - name: Vet
        run: go vet ./...

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Test
        run: python -m pytest

  soroban-gas:
    name: Soroban gas profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            contracts/soroban/target
          key: soroban-gas-${{ hashFiles('contracts/soroban/Cargo.lock') }}

      - name: Profile the base branch
        if: github.event_name == 'pull_request'
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/contracts/soroban/gas_profile/Cargo.toml" ]; then
            go run ./tools/gas_profiler \
              -manifest "$RUNNER_TEMP/base/contracts/soroban/Cargo.toml" \
              -markdown "$RUNNER_TEMP/base-gas-report.md" \
              -json "$RUNNER_TEMP/base-gas-report.json"
          else
            echo "The base branch has no gas profile, skipping the regression comparison."
          fi

      - name: Profile and fail on gas regressions over 15%
        run: |
          baseline=""
          if [ -f "$RUNNER_TEMP/base-gas-report.json" ]; then
            baseline="-baseline $RUNNER_TEMP/base-gas-report.json -max-regression 15"
          fi
          go run ./tools/gas_profiler -markdown gas-report.md -json gas-report.json $baseline

      - name: Publish the gas report
        if: always()
        run: |
          if [ -f gas-report.md ]; then cat gas-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the gas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-gas-report
          path: |
            gas-report.md
            gas-report.json
          if-no-files-found: ignore
