# Workspace for the Soroban contracts that share one lockfile, one release
# profile and the gas profiling harness (see tools/gas_profiler). The older
# standalone crates are listed under `exclude` so they keep building on their
# own manifests.
[workspace]
resolver = "2"
members = ["attestation", "bridge_adapter", "gas_profile"]
exclude = [
    "circuit_breaker_proxy",
    "common",
    "contract_wallet",
    "escrow",
    "fee_splitter",
    "liquidity_router",
    "oracle_aggregator",
    "payment_stream",
    "sac_wrapper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
